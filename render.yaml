# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the web service and a PostgreSQL database, and wires DATABASE_URL.
services:
  - type: web
    name: scale-media-scripts
    runtime: node
    # Paid instance so the server stays awake: reminders run inside it.
    # On the free plan the service sleeps when idle and reminders stop.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scale-media-db
          property: connectionString
      # The first manager account; set these in the dashboard when prompted.
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_NAME
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      # Optional: turns on New work → Paste notes (Claude reads pasted notes). From console.anthropic.com → API keys.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: scale-media-db
    plan: basic-256mb
    postgresMajorVersion: "16"
