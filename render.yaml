# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the web service and a PostgreSQL database, and wires DATABASE_URL.
services:
  - type: web
    name: scale-media-scripts
    runtime: node
    # Paid instance so the server stays awake: reminders run inside it.
    # On the free plan the service sleeps when idle and reminders stop.
    plan: starter
    buildCommand: npm ci && npm run build
    # Node directly (no npm process alongside it), with a capped heap so memory
    # stays well inside the Starter plan's 512 MB.
    startCommand: node --max-old-space-size=200 --max-semi-space-size=2 dist/server/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scale-media-db
          property: connectionString
      # The first manager account; set these in the dashboard when prompted.
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_NAME
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      # Optional: turns on New work → Paste notes (Claude reads pasted notes). From console.anthropic.com → API keys.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Recommended: how many proxies sit in front of the app, so sign-in limits and the Master log
      # see each person's real address. Blank trusts X-Forwarded-For entirely, which clients can forge.
      # To check a number: sign in, then your own address in the Master log should be the one
      # a "what is my IP" site shows you. Too low a number gives everyone the proxy's address.
      - key: TRUST_PROXY
        sync: false

databases:
  - name: scale-media-db
    plan: basic-256mb
    postgresMajorVersion: "16"
